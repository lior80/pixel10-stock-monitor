name: Pixel 10 Stock Monitor

on:
  workflow_dispatch:

  schedule:
    # Approximately every 5 minutes
    - cron: "2-59/5 * * * *"

# Prevent overlapping checks
concurrency:
  group: pixel10-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:

      # ------------------------------------------
      # Get the repository
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------
      # Python
      # ------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ------------------------------------------
      # Restore the previous stock state
      # ------------------------------------------
      - name: Restore previous stock state
        uses: actions/cache/restore@v4
        with:
          path: .stock-state
          key: pixel10-state-${{ github.run_id }}
          restore-keys: |
            pixel10-state-

      # ------------------------------------------
      # Install browser + Python dependencies
      # ------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium

      # ------------------------------------------
      # Check Best Buy
      # ------------------------------------------
      - name: Check Best Buy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          cat > monitor.py <<'PY'

          import os
          import requests

          from playwright.sync_api import sync_playwright


          # ==========================================
          # PRODUCT
          # ==========================================

          URL = (
              "https://www.bestbuy.ca/en-ca/product/"
              "open-box-google-pixel-10-128gb-lemongrass-unlocked/"
              "19489235"
          )


          # ==========================================
          # TELEGRAM
          # ==========================================

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]


          def send_telegram(message):

              api_url = (
                  f"https://api.telegram.org/bot"
                  f"{BOT_TOKEN}/sendMessage"
              )

              response = requests.post(
                  api_url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message,
                      "disable_web_page_preview": False
                  },
                  timeout=30
              )

              print("Telegram HTTP status:", response.status_code)

              response.raise_for_status()


          # ==========================================
          # STATE
          # ==========================================

          STATE_DIR = ".stock-state"
          STATE_FILE = os.path.join(
              STATE_DIR,
              "status"
          )

          os.makedirs(
              STATE_DIR,
              exist_ok=True
          )


          def get_previous_state():

              if not os.path.exists(STATE_FILE):
                  return "unknown"

              with open(
                  STATE_FILE,
                  "r"
              ) as file:

                  return file.read().strip()


          def save_state(state):

              with open(
                  STATE_FILE,
                  "w"
              ) as file:

                  file.write(state)


          previous_state = get_previous_state()


          print("======================================")
          print("Best Buy Pixel 10 Stock Monitor")
          print("======================================")
          print("Previous state:", previous_state)
          print("URL:", URL)


          # ==========================================
          # OPEN BEST BUY
          # ==========================================

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page(
                  viewport={
                      "width": 1440,
                      "height": 1000
                  },

                  user_agent=(
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/140.0.0.0 "
                      "Safari/537.36"
                  )
              )

              print("Opening Best Buy...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              # Allow Best Buy JavaScript to load.
              page.wait_for_timeout(8000)

              print("Page title:")
              print(page.title())


              # ==========================================
              # READ PAGE
              # ==========================================

              text = page.locator(
                  "body"
              ).inner_text(
                  timeout=30000
              )

              text_lower = text.lower()

              print(
                  "Page text length:",
                  len(text)
              )


              # ==========================================
              # SHOW AVAILABILITY-RELATED TEXT
              # ==========================================

              print("")
              print("---- AVAILABILITY TEXT ----")

              interesting_lines = []

              for line in text.splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  lower = line.lower()

                  keywords = [
                      "add to cart",
                      "add to bag",
                      "buy now",
                      "sold out",
                      "out of stock",
                      "unavailable",
                      "available",
                      "pickup",
                      "shipping"
                  ]

                  if any(
                      keyword in lower
                      for keyword in keywords
                  ):

                      interesting_lines.append(
                          line
                      )


              for line in interesting_lines[:100]:

                  print(line)


              print("---------------------------")
              print("")


              # ==========================================
              # FIND PURCHASE CONTROLS
              # ==========================================

              buttons = page.locator(
                  "button, a"
              )

              purchase_buttons = []

              for i in range(
                  min(
                      buttons.count(),
                      200
                  )
              ):

                  try:

                      element = buttons.nth(i)

                      if not element.is_visible():
                          continue

                      button_text = (
                          element.inner_text(
                              timeout=1000
                          )
                          .strip()
                          .lower()
                      )

                      if any(
                          phrase in button_text
                          for phrase in [
                              "add to cart",
                              "add to bag",
                              "buy now"
                          ]
                      ):

                          purchase_buttons.append(
                              button_text
                          )

                  except Exception:
                      pass


              print(
                  "Purchase controls found:",
                  purchase_buttons
              )


              # ==========================================
              # DETERMINE AVAILABILITY
              # ==========================================

              unavailable_phrases = [
                  "sold out",
                  "out of stock",
                  "currently unavailable",
                  "not available"
              ]


              unavailable = any(
                  phrase in text_lower
                  for phrase in unavailable_phrases
              )


              purchase_available = (
                  len(purchase_buttons) > 0
              )


              currently_available = (
                  purchase_available
                  and not unavailable
              )


              print(
                  "Unavailable:",
                  unavailable
              )

              print(
                  "Purchase control:",
                  purchase_available
              )

              print(
                  "Currently available:",
                  currently_available
              )


              # ==========================================
              # STATE CHANGE DETECTION
              # ==========================================

              if currently_available:

                  print(
                      "RESULT: AVAILABLE"
                  )

                  # Alert ONLY when we transition
                  # from unavailable/unknown -> available.

                  if previous_state != "available":

                      print(
                          "NEW AVAILABILITY DETECTED!"
                      )

                      message = (
                          "🚨🚨 PIXEL 10 AVAILABLE! 🚨🚨\n\n"
                          "Open Box Google Pixel 10\n"
                          "128GB Lemongrass Unlocked\n\n"
                          "Best Buy Canada\n\n"
                          "CHECK NOW:\n"
                          f"{URL}"
                      )

                      send_telegram(
                          message
                      )

                      print(
                          "Telegram alert sent."
                      )

                  else:

                      print(
                          "Still available."
                      )

                      print(
                          "Alert already sent previously."
                      )


                  save_state(
                      "available"
                  )


              else:

                  print(
                      "RESULT: UNAVAILABLE"
                  )

                  # Reset state so that a future restock
                  # produces a new Telegram alert.

                  save_state(
                      "unavailable"
                  )


              browser.close()


          PY

          python monitor.py


      # ------------------------------------------
      # Save the current state
      # ------------------------------------------
      - name: Save stock state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .stock-state
          key: pixel10-state-${{ github.run_id }}