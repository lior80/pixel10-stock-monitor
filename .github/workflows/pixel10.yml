name: Pixel 10 Stock Monitor

on:
  workflow_dispatch:

  schedule:
    # Approximately every 5 minutes
    - cron: "2-59/5 * * * *"

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip -m pip install --upgrade pip
          pip install playwright requests python -m playwright install --with-deps chromium

      - name: Check Best Buy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          cat > monitor.py <<'PY'

          import os
          import re
          import requests

          from playwright.sync_api import sync_playwright

          URL = (
              "https://www.bestbuy.ca/en-ca/product/"
              "open-box-google-pixel-10-128gb-lemongrass-unlocked/"
              "19489235"
          )

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]


          def telegram(message):

              api_url = (
                  f"https://api.telegram.org/bot"
                  f"{BOT_TOKEN}/sendMessage"
              )

              response = requests.post(
                  api_url,
                  data={
                      "chat_id": CHAT_ID,
                      "text": message,
                      "disable_web_page_preview": False
                  },
                  timeout=30
              )

              print("Telegram:", response.status_code)
              print(response.text)

              response.raise_for_status()


          print("======================================")
          print("Best Buy Pixel 10 Monitor")
          print("======================================")
          print(URL)

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page(
                  viewport={
                      "width": 1440,
                      "height": 1000
                  },
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/140.0.0.0 Safari/537.36"
                  )
              )

              print("Opening Best Buy...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              # Give Best Buy's JavaScript time to finish.
              page.wait_for_timeout(8000)

              title = page.title()

              print("Page title:")
              print(title)

              text = page.locator("body").inner_text(
                  timeout=30000
              )

              text_lower = text.lower()

              print("Page text length:", len(text))

              # Save useful diagnostic information.
              print("---- AVAILABILITY TEXT ----")

              interesting = []

              for line in text.splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  lower = line.lower()

                  keywords = [
                      "add to cart",
                      "add to bag",
                      "buy now",
                      "sold out",
                      "out of stock",
                      "unavailable",
                      "available",
                      "pickup",
                      "shipping"
                  ]

                  if any(k in lower for k in keywords):
                      interesting.append(line)

              for line in interesting[:100]:
                  print(line)

              print("---------------------------")

              # Look for purchase buttons.
              buttons = page.locator(
                  "button, a"
              )

              purchase_buttons = []

              for i in range(min(buttons.count(), 200)):

                  try:

                      element = buttons.nth(i)

                      if not element.is_visible():
                          continue

                      button_text = (
                          element.inner_text(
                              timeout=1000
                          )
                          .strip()
                          .lower()
                      )

                      if any(
                          phrase in button_text
                          for phrase in [
                              "add to cart",
                              "add to bag",
                              "buy now"
                          ]
                      ):

                          purchase_buttons.append(
                              button_text
                          )

                  except Exception:
                      pass

              print(
                  "Purchase controls found:",
                  purchase_buttons
              )

              # -------------------------------------------------
              # Determine availability
              # -------------------------------------------------

              unavailable_phrases = [
                  "sold out",
                  "out of stock",
                  "currently unavailable",
                  "not available"
              ]

              unavailable = any(
                  phrase in text_lower
                  for phrase in unavailable_phrases
              )

              purchase_available = (
                  len(purchase_buttons) > 0
              )

              print(
                  "Unavailable:",
                  unavailable
              )

              print(
                  "Purchase control:",
                  purchase_available
              )

              # -------------------------------------------------
              # Alert only when something looks available.
              # -------------------------------------------------

              if purchase_available and not unavailable:

                  message = (
                      "🚨🚨 PIXEL 10 MAY BE AVAILABLE! 🚨🚨\n\n"
                      "Open Box Google Pixel 10\n"
                      "128GB Lemongrass Unlocked\n\n"
                      "Best Buy Canada\n\n"
                      "CHECK NOW:\n"
                      f"{URL}"
                  )

                  telegram(message)

              else:

                  print(
                      "Pixel 10 does not appear to be available."
                  )

              browser.close()

          PY

          python monitor.py